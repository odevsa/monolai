name: Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag or number (e.g. v1.2.3 or 1.2.3)'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_NAME: monolai

jobs:
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(grep -m1 '^version' backend/Cargo.toml | cut -d '"' -f2)
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync project version
        shell: bash
        run: |
          just version "${{ steps.get_version.outputs.VERSION }}"

      - name: Define Package Names
        id: names
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          APP_NAME="${{ env.APP_NAME }}"
          echo "EXE_NAME=${APP_NAME}-${VERSION}-windows-${ARCH}.exe" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

      - name: Generate icons
        shell: bash
        run: |
          chmod +x packaging/scripts/generate-icons.sh
          ./packaging/scripts/generate-icons.sh --windows

      - name: Build server & desktop binaries
        shell: bash
        run: |
          cargo build --manifest-path backend/Cargo.toml --release --target ${{ matrix.target }}
          cargo build --manifest-path desktop/Cargo.toml --release --target ${{ matrix.target }}

      - name: Package Windows Installer
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          BIN_DIR="desktop/target/${{ matrix.target }}/release"
          # Ensure backend exe is in the same folder for packaging
          cp "backend/target/${{ matrix.target }}/release/monolai.exe" "${BIN_DIR}/monolai.exe"
          mkdir -p dist

          # NSIS Installer (.exe)
          makensis -NOCD \
            -DVERSION="${VERSION}" \
            -DARCH="${ARCH}" \
            -DBIN_DIR="${BIN_DIR}" \
            -DASSETS_DIR="packaging/windows/assets" \
            -DOUT_DIR="dist" \
            packaging/windows/monolai.nsi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monolai-windows-${{ matrix.arch }}
          path: dist/*

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release upload "${TAG}" dist/* --clobber
