services:
  monolai:
    image: odevsa/monolai:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: monolai
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - HARDWARE=auto
    volumes:
      - ./.monolai/models:/app/models
      - ./.monolai/runtimes:/app/runtimes
