flags:
  - flag: "--model"
    name: "Model File"
    description: "Path to the main GGUF model file"
    type: "file"
    important: true
    default_value: ""
  - flag: "--ctx-size"
    name: "Context Size"
    description: "Prompt context window size (e.g. 4096, 8192, 16384)"
    type: "int"
    important: true
    default_value: "4096"
  - flag: "--n-gpu-layers"
    name: "GPU Layers"
    description: "Number of layers offloaded to GPU VRAM (use 99 for all)"
    type: "int"
    important: true
    default_value: "99"
  - flag: "--mmproj"
    name: "Multimodal Projector"
    description: "Path to the mmproj GGUF file for vision models"
    type: "file"
    important: false
    default_value: ""
  - flag: "--threads"
    name: "CPU Threads"
    description: "Number of CPU threads to use for processing"
    type: "int"
    important: false
    default_value: "8"
  - flag: "--batch-size"
    name: "Logical Batch Size"
    description: "Logical batch size for prompt processing"
    type: "int"
    important: false
    default_value: "2048"
  - flag: "--ubatch-size"
    name: "Physical Batch Size"
    description: "Physical batch size for prompt processing"
    type: "int"
    important: false
    default_value: "512"
  - flag: "--chat-template"
    name: "Chat Template"
    description: "Name of built-in Jinja chat template (llama3, chatml, deepseek, etc.)"
    type: "string"
    important: false
    default_value: ""
  - flag: "--embedding"
    name: "Enable Embeddings"
    description: "Enable text embedding generation endpoint"
    type: "bool"
    important: false
    default_value: "false"
