id: llama-cpp
name: "LLaMA C++ Server"
version: "b11146"
website: "https://github.com/ggml-org/llama.cpp"
description: |
  High-performance LLM inference engine in C/C++ supporting text generation,
  OpenAI-compatible HTTP chat and completion endpoints, multimodal vision models,
  and full or partial GPU layer offloading (CUDA, ROCm, Vulkan, and CPU).
features:
  - chat
  - completion
  - embeddings
binary_name: "llama-server"

downloads:
  linux:
    x86_64:
      cpu:
        url: "https://github.com/ggml-org/llama.cpp/releases/download/{version}/llama-{version}-bin-ubuntu-x64.tar.gz"
        archive_type: "tar.gz"
      vulkan:
        url: "https://github.com/ggml-org/llama.cpp/releases/download/{version}/llama-{version}-bin-ubuntu-vulkan-x64.tar.gz"
        archive_type: "tar.gz"
      cuda:
        url: "https://github.com/ggml-org/llama.cpp/releases/download/{version}/llama-{version}-bin-ubuntu-cuda-12.8-x64.tar.gz"
        archive_type: "tar.gz"
        extra_archives:
          - url: "https://github.com/ggml-org/llama.cpp/releases/download/{version}/cudart-llama-{version}-bin-ubuntu-cuda-12.8-x64.tar.gz"
            archive_type: "tar.gz"
      cuda-12.8:
