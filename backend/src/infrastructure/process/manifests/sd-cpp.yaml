id: sd-cpp
name: "Stable Diffusion C++ Server"
website: "https://github.com/leejet/stable-diffusion.cpp"
upstream:
  type: github_release
  repository: "leejet/stable-diffusion.cpp"
  tag_regex: "master-\\d+-(?P<commit>[a-f0-9]+)"
description: |
  Stable Diffusion inference in pure C/C++ supporting text-to-image, image-to-image,
  SD1.x, SD2.x, SDXL, FLUX, and SD3.5 model architectures with GPU offload.
features:
  - image-generation
supported_modalities:
  - text-to-image
  - image-to-image
supported_formats:
  - gguf
  - safetensors
binary_name: "sd-server"

downloads:
  linux:
    x86_64:
      cpu:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-Linux-Ubuntu-24.04-x86_64.zip"
        archive_type: "zip"
      vulkan:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip"
        archive_type: "zip"
      rocm:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-Linux-Ubuntu-24.04-x86_64-rocm-7.14.0.zip"
        archive_type: "zip"
  windows:
    x86_64:
      cpu:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-win-cpu-x64.zip"
        archive_type: "zip"
      cuda:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-win-cuda12-x64.zip"
        archive_type: "zip"
        extra_archives:
          - url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/cudart-sd-bin-win-cu12-x64.zip"
            archive_type: "zip"
      cuda-12:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-win-cuda12-x64.zip"
        archive_type: "zip"
        extra_archives:
          - url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/cudart-sd-bin-win-cu12-x64.zip"
            archive_type: "zip"
      vulkan:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-win-vulkan-x64.zip"
        archive_type: "zip"
      rocm:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-win-rocm-7.14.0-x64.zip"
        archive_type: "zip"
  macos:
    arm64:
      metal:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-Darwin-macOS-26.6.2-arm64.zip"
        archive_type: "zip"
      cpu:
        url: "https://github.com/leejet/stable-diffusion.cpp/releases/download/{version}/sd-master-{commit}-bin-Darwin-macOS-26.6.2-arm64.zip"
        archive_type: "zip"

flags:
  # Model Components
  - flag: "--model"
    name: "Model File"
    description: "Path to the main Stable Diffusion checkpoint, safetensors, or GGUF file"
    type: "file"
    model: true
    important: true
    default_value: ""
  - flag: "--diffusion-model"
    name: "Diffusion Model"
    description: "Path to standalone diffusion backbone model (FLUX.1, SD3, Wan, Qwen-Image)"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--vae"
    name: "VAE File"
    description: "Path to separate Variational Autoencoder (VAE) weights file"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--clip_l"
    name: "CLIP-L Encoder"
    description: "Path to CLIP-L text encoder file (FLUX, SD3, SDXL)"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--clip_g"
    name: "CLIP-G Encoder"
    description: "Path to CLIP-G text encoder file (SDXL, SD3)"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--t5xxl"
    name: "T5-XXL Encoder"
    description: "Path to T5-XXL text encoder file (FLUX, SD3, SD3.5)"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--llm"
    name: "LLM Encoder"
    description: "Path to LLM text encoder (e.g. Qwen2-VL for Qwen-Image, Mistral-Small for Flux2)"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--clip_vision"
    name: "CLIP Vision"
    description: "Path to CLIP-Vision encoder model (required for IP-Adapter)"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--taesd"
    name: "TAESD File"
    description: "Path to Tiny AutoEncoder (TAESD) for fast latent preview decoding"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--control-net"
    name: "ControlNet"
    description: "Path to ControlNet condition model"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--ip-adapter"
    name: "IP-Adapter"
    description: "Path to IP-Adapter image prompt model"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--motion-module"
    name: "Motion Module"
    description: "Path to AnimateDiff motion module for video generation"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--photo-maker"
    name: "PhotoMaker"
    description: "Path to PhotoMaker identity model"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--pulid-weights"
    name: "PuLID Weights"
    description: "Path to PuLID facial identity weights"
    type: "file-auxiliary"
    default_value: ""
  - flag: "--upscale-model"
    name: "Upscaler Model"
    description: "Path to RealESRGAN model for high-resolution upscaling"
    type: "file-auxiliary"
    default_value: ""

  # Directories
  - flag: "--lora-model-dir"
    name: "LoRA Directory"
    description: "Directory containing LoRA adapter models"
    type: "string"
    default_value: ""
  - flag: "--embd-dir"
    name: "Embeddings Directory"
    description: "Directory containing textual inversion embedding files"
    type: "string"
    default_value: ""
  - flag: "--hires-upscalers-dir"
    name: "Hires Upscalers Directory"
    description: "Directory containing high-resolution fix upscaler models"
    type: "string"
    default_value: ""

  # Performance & Hardware
  - flag: "--threads"
    name: "CPU Threads"
    description: "Number of CPU threads to use during computation (-1 for CPU core count)"
    type: "int"
    default_value: "8"
  - flag: "--offload-to-cpu"
    name: "Offload Weights to CPU"
    description: "Store weights in system RAM to conserve VRAM, offloading to GPU only as needed"
    type: "bool"
    default_value: "false"
  - flag: "--vae-on-cpu"
    name: "VAE on CPU"
    description: "Execute VAE encoding and decoding on CPU to save GPU VRAM"
    type: "bool"
    default_value: "false"
  - flag: "--clip-on-cpu"
    name: "CLIP on CPU"
    description: "Execute CLIP text encoding on CPU to save GPU VRAM"
    type: "bool"
    default_value: "false"
  - flag: "--vae-tiling"
    name: "VAE Tiling"
    description: "Process VAE in tiles to prevent out-of-memory errors on large resolutions"
    type: "bool"
    default_value: "false"
  - flag: "--mmap"
    name: "Enable mmap"
    description: "Memory-map model files for faster loading and shared system cache"
    type: "bool"
    default_value: "true"
  - flag: "--eager-load"
    name: "Eager Load"
    description: "Load all model weights eagerly into memory at startup instead of on first use"
    type: "bool"
    default_value: "false"
  - flag: "--sage-attn"
    name: "SageAttention"
    description: "Use native CUDA SageAttention in diffusion model for faster inference"
    type: "bool"
    default_value: "false"
  - flag: "--max-vram"
    name: "Max VRAM Budget"
    description: "Per-device VRAM budget in GiB for automatic graph cutting (e.g. 6 or cuda0=6)"
    type: "string"
    default_value: ""
  - flag: "--backend"
    name: "Backend Assignment"
    description: "Module backend assignment (e.g. cpu or clip=cpu,vae=cuda0,diffusion=cuda0)"
    type: "string"
    default_value: ""
  - flag: "--split-mode"
    name: "Split Mode"
    description: "Multi-GPU weight distribution mode"
    type: "enum"
    default_value: "layer"
    options:
      - "layer"
      - "row"

  # Generation & Sampling Defaults
  - flag: "--cfg-scale"
    name: "CFG Scale"
    description: "Classifier-Free Guidance scale (prompt adherence strength)"
    type: "number"
    default_value: "7.0"
  - flag: "--sampling-method"
    name: "Sampling Method"
    description: "Diffusion sampling algorithm"
    type: "enum"
    default_value: "euler_a"
    options:
      - "euler"
      - "euler_a"
      - "heun"
      - "dpm2"
      - "dpm++2s_a"
      - "dpm++2m"
      - "dpm++2mv2"
      - "lcm"
      - "ipndm"
      - "ipndm_v"
  - flag: "--schedule-method"
    name: "Schedule Method"
    description: "Noise schedule type"
    type: "enum"
    default_value: "default"
    options:
      - "default"
      - "discrete"
      - "karras"
      - "exponential"
      - "ays"
      - "gits"
  - flag: "--steps"
    name: "Steps"
    description: "Default number of diffusion denoising steps"
    type: "int"
    default_value: "20"
  - flag: "--seed"
    name: "Seed"
    description: "RNG generation seed (-1 for random)"
    type: "int"
    default_value: "-1"
  - flag: "--width"
    name: "Default Width"
    description: "Default output image width in pixels"
    type: "int"
    default_value: "512"
  - flag: "--height"
    name: "Default Height"
    description: "Default output image height in pixels"
    type: "int"
    default_value: "512"
  - flag: "--clip-skip"
    name: "CLIP Skip"
    description: "Number of last CLIP layers to skip (-1 for model default, 1 for SD1.5, 2 for Anime)"
    type: "int"
    default_value: "-1"
  - flag: "--type"
    name: "Weight Type"
    description: "Precision format for model weights during computation"
    type: "enum"
    default_value: "f16"
    options:
      - "f16"
      - "f32"
      - "q8_0"
      - "q5_1"
      - "q5_0"
      - "q4_1"
      - "q4_0"
  - flag: "--rng"
    name: "RNG Engine"
    description: "Random number generator backend"
    type: "enum"
    default_value: "cuda"
    options:
      - "cuda"
      - "std_default"
  - flag: "--prediction"
    name: "Prediction Type"
    description: "Diffusion prediction target override"
    type: "enum"
    default_value: "epsilon"
    options:
      - "epsilon"
      - "v_prediction"

  # Server
  - flag: "--listen-ip"
    name: "Listen IP"
    description: "IP address to bind the HTTP server to"
    type: "string"
    default_value: "127.0.0.1"
  - flag: "--listen-port"
    name: "Listen Port"
    description: "Port to listen on for HTTP requests"
    type: "int"
    default_value: "1234"
