id: llama-cpp
name: "LLaMA C++ Server"
website: "https://github.com/ggml-org/llama.cpp"
upstream:
  type: github_release
  repository: "ggml-org/llama.cpp"
  include_prereleases: true
  tag_regex: "^b\\d+$"
description: |
  High-performance LLM inference engine in C/C++ supporting text generation,
  OpenAI-compatible HTTP chat and completion endpoints, multimodal vision models,
  and full or partial GPU layer offloading (CUDA, ROCm, Vulkan, and CPU).
features:
  - chat
  - completion
  - embeddings
supported_modalities:
  - text-to-text
  - embeddings
supported_formats:
  - gguf
binary_name: "llama-server"

